services:
  # MongoDB Database Service
  mongo:
    image: mongo:6.0
    container_name: inventory_db
    restart: always
    environment:
      MONGO_INITDB_DATABASE: inventory_erp
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  # Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_backend
    restart: always
    ports:
      - "5050:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/inventory_erp
      JWT_SECRET: your_production_super_secret_jwt_key_here
      JWT_EXPIRE: 30d
      CORS_ORIGIN: "*"
    depends_on:
      - mongo
    networks:
      - app-network

  # React Frontend (Nginx) Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventory_frontend
    restart: always
    ports:
      - "85:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo_data:
    driver: local

networks:
  app-network:
    driver: bridge
